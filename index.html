<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Access Granted · Eunice @50</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Cormorant+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --gold: #9b6a1c; --gold-light: #c9a24a; --ink: #1d1a17; --cream: #f4f2ef; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    background: var(--cream); color: var(--ink); text-align: center;
    min-height: 100vh; min-height: 100dvh; padding: 36px 24px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .frame {
    width: min(420px, 100%); padding: 34px 22px 30px;
    border: 1px solid #e3ddd3; background: #fbf9f5; position: relative;
    box-shadow: 0 18px 40px rgba(80,60,30,.08);
  }
  .frame::before { content: ""; position: absolute; inset: 8px; border: 1px solid rgba(155,106,28,.35); pointer-events: none; }

  .eyebrow { font-family: "Cormorant SC", Georgia, serif; color: var(--gold); letter-spacing: 4px; font-size: 14px;
             opacity: 0; animation: fade .5s .1s forwards; }

  .photo {
    width: 150px; height: 150px; margin: 22px auto 18px; border-radius: 50%; overflow: hidden;
    border: 3px solid var(--gold-light); box-shadow: 0 0 0 6px #fbf9f5, 0 0 0 7px rgba(155,106,28,.4);
    opacity: 0; transform: scale(.9); animation: grow .6s .2s ease forwards;
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .name { font-size: 52px; line-height: 1; color: var(--gold); font-weight: 500;
          opacity: 0; animation: fade .5s .45s forwards; }
  .name .at { font-style: italic; font-size: .82em; }
  .tag { margin-top: 6px; font-style: italic; font-size: 20px; color: #5c554d; opacity: 0; animation: fade .5s .55s forwards; }

  .date { margin-top: 4px; font-family: "Cormorant SC", Georgia, serif; letter-spacing: 2px; font-size: 15px; color: var(--gold); opacity: 0; animation: fade .5s .6s forwards; }
  .rule { width: 60px; height: 1px; background: var(--gold); margin: 22px auto; opacity: 0; animation: fade .5s .6s forwards; }

  .badge {
    width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 16px;
    background: linear-gradient(145deg, #2f9e5b, #1d7a43);
    border: 3px solid var(--gold-light); display: grid; place-items: center; transform: scale(0);
    animation: pop .5s .75s cubic-bezier(.2,1.6,.4,1) forwards, pulse 2.4s 1.6s infinite;
  }
  .badge svg { width: 44px; height: 44px; stroke: #fff; stroke-width: 9; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .badge path { stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw .5s 1.1s ease forwards; }

  h1 { font-family: "Cormorant SC", Georgia, serif; font-weight: 600; font-size: 40px; letter-spacing: 3px; line-height: 1.05;
       opacity: 0; animation: fade .5s 1.15s forwards; }
  .verified { margin-top: 12px; display: inline-block; padding: 7px 18px; border: 1px solid var(--gold); color: var(--gold);
              font-family: "Cormorant SC", Georgia, serif; letter-spacing: 3px; font-size: 15px;
              opacity: 0; animation: fade .5s 1.3s forwards; }
  .welcome { margin-top: 20px; font-style: italic; font-size: 19px; color: #5c554d; opacity: 0; animation: fade .5s 1.45s forwards; }
  .time { margin-top: 6px; font-size: 14px; color: #8a8278; opacity: 0; animation: fade .5s 1.55s forwards; }

  @keyframes fade { to { opacity: 1; } }
  @keyframes grow { to { opacity: 1; transform: none; } }
  @keyframes pop  { to { transform: scale(1); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(201,162,74,.45); } 50% { box-shadow: 0 0 0 16px rgba(201,162,74,0); } }
</style>
</head>
